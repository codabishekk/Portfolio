<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>

  <!-- Bracket left < -->
  <polyline points="28,34 16,50 28,66"
    fill="none"
    stroke="url(#accent)"
    stroke-width="6.5"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- Bracket right > -->
  <polyline points="72,34 84,50 72,66"
    fill="none"
    stroke="url(#accent)"
    stroke-width="6.5"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- Letter A (for Abishek) in the center -->
  <text
    x="50"
    y="62"
    text-anchor="middle"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="32"
    font-weight="700"
    fill="white"
    letter-spacing="-1">A</text>

  <!-- Dot accent below A (like a cursor / code dot) -->
  <circle cx="50" cy="76" r="3.5" fill="url(#accent)"/>
</svg>
